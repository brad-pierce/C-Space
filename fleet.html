<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>C-SPACE // fleet</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #19c6d1; font: 12px/1.6 "Cascadia Code", ui-monospace, monospace;
      letter-spacing: 0.35em; z-index: 20; background: #05060a;
      transition: opacity 0.9s ease; text-transform: uppercase;
    }
    #boot.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="boot">initializing fleet…</div>
  <script type="module" src="/src/fleet/fleetMain.js"></script>
</body>
</html>
